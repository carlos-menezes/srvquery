name: Release

on:
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm fmt:check

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Record existing package tags
        run: git tag --list '@srvquery/*@*' | sort > "$RUNNER_TEMP/package-tags-before.txt"

      - name: Publish packages
        run: pnpm release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Push package tags
        id: tags
        shell: bash
        run: |
          git tag --list '@srvquery/*@*' | sort > "$RUNNER_TEMP/package-tags-after.txt"
          comm -13 "$RUNNER_TEMP/package-tags-before.txt" "$RUNNER_TEMP/package-tags-after.txt" > "$RUNNER_TEMP/package-tags-new.txt"

          if [[ -s "$RUNNER_TEMP/package-tags-new.txt" ]]; then
            git push origin $(tr '\n' ' ' < "$RUNNER_TEMP/package-tags-new.txt")
            echo "created=true" >> "$GITHUB_OUTPUT"
          else
            echo "created=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Releases
        if: steps.tags.outputs.created == 'true'
        shell: bash
        run: |
          while IFS= read -r tag; do
            gh release create "$tag" --title "$tag" --generate-notes
          done < "$RUNNER_TEMP/package-tags-new.txt"
        env:
          GH_TOKEN: ${{ github.token }}
